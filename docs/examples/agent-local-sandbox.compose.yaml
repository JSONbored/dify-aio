# Attach the AIO to this internal network with the alias dify-aio.
services:
  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.20.0@sha256:06647550dd4c53b18ad73e6e831391e841fae9c8f23e28a48c74e254b8e797a1
    command:
      - shellctl
      - serve
      - --listen
      - 0.0.0.0:5004
      - --require-auth-token
    restart: unless-stopped
    environment:
      SHELLCTL_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:?Set a private token shared with the AIO}
    volumes:
      - agent_home:/home/dify
      - agent_workspace:/workspace
    networks: [agent_sandbox]
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:5004/healthz
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  agent_sandbox:
    name: dify-aio-agent-sandbox
    internal: true
volumes:
  agent_home:
  agent_workspace:
