name: Refresh Dify release inputs
on:
  push:
    branches: [maintenance/refresh-dify-1.20.0]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cb7c9d42aeab71c6636a7c8db2908f05dce6d0dd
          persist-credentials: false
      - name: Apply fleet formatters and verify the generated template
        run: |
          pipx run --spec black==26.3.1 black scripts/generate_dify_template.py scripts/refresh_upstream_inventory.py tests/integration/test_container_runtime.py tests/integration/test_optional_integrations.py tests/template/test_template_policy.py
          npx --yes prettier@3.8.3 --write README.md docs/upstream-tracking.md docs/examples/agent-local-sandbox.compose.yaml
          python3 scripts/generate_dify_template.py --check
      - name: Save generated inputs to the reviewed release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, subprocess
          from pathlib import Path

          paths = ["scripts/generate_dify_template.py","scripts/refresh_upstream_inventory.py","tests/integration/test_container_runtime.py","tests/integration/test_optional_integrations.py","tests/template/test_template_policy.py","README.md","docs/upstream-tracking.md","docs/examples/agent-local-sandbox.compose.yaml"]
          if not subprocess.check_output(["git", "diff", "--name-only", "--", *paths]).strip():
              raise SystemExit(0)
          data = {
              "query": "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": "JSONbored/dify-aio", "branchName": "fix/dify-1.20-runtime"},
                  "expectedHeadOid": subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                  "message": {"headline":"style: apply fleet-pinned formatters to the Dify upgrade"},
                  "fileChanges":{"additions":[{"path":p,"contents":base64.b64encode(Path(p).read_bytes()).decode()} for p in paths]},
              }},
          }
          subprocess.run(["gh","api","graphql","--input","-"],input=json.dumps(data),text=True,check=True)
          PY
